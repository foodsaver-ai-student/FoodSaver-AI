<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodSaver AI - Freshness Checker</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <!-- FOOD SAVER AI HEADER -->

    <h1>🥗 FoodSaver AI</h1>

    <h2>AI-Powered Food Freshness Checker</h2>

    <p>
        Upload your food image to check its freshness.
    </p>


    <!-- IMAGE UPLOAD FORM -->

    <form action="/analyze"
          method="POST"
          enctype="multipart/form-data">

        <label for="foodImage">
            Choose Food Image
        </label>

        <br><br>


        <!-- SUPPORTED IMAGE FORMATS -->

        <input
            type="file"
            id="foodImage"
            name="food_image"

            accept="
                .jpg,
                .jpeg,
                .png,
                .webp,
                .gif,
                .bmp,
                .tiff,
                .tif,
                .jfif,
                image/jpeg,
                image/png,
                image/webp,
                image/gif,
                image/bmp,
                image/tiff
            "

            capture="environment"

            required
        >

        <br><br>


        <!-- IMAGE PREVIEW -->

        <img
            id="preview"
            alt="Food Preview"
            width="250"
            style="display:none;"
        >

        <br><br>


        <!-- ANALYZE BUTTON -->

        <button type="submit">
            Check Freshness
        </button>

    </form>


    <!-- IMAGE PREVIEW SCRIPT -->

    <script>

        const imageInput =
            document.getElementById("foodImage");

        const preview =
            document.getElementById("preview");


        imageInput.addEventListener("change", function () {

            const file = this.files[0];

            if (file) {

                preview.src =
                    URL.createObjectURL(file);

                preview.style.display = "block";

            }

        });

    </script>

</div>

</body>

</html>
