
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSaver AI - Freshness Checker</title>
    <link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">

    <!-- Existing FoodSaver AI heading,
         description and upload form -->

    <h1>🥗 FoodSaver AI</h1>
    <h2>AI-Powered Food Freshness Checker</h2>
    <p>Upload your food image to check its freshness.</p>

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <label for="foodImage">Choose Food Image</label>
        <br><br>

        <input
            type="file"
            id="foodImage"
            name="food_image"
            accept="image/*"
            capture="environment"
            required
        >

        <br><br>

        <img
            id="preview"
            alt="Food Preview"
            width="250"
            style="display:none;"
        >

        <br><br>

        <button type="submit">Check Freshness</button>

    </form>

    <script>
        const imageInput = document.getElementById("foodImage");
        const preview = document.getElementById("preview");

        imageInput.addEventListener("change", function () {
            const file = this.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        });
    </script>
</div>
</body>
</html>
